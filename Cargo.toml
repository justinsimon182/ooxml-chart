[package]
name = "ooxml-chart"
description = "Author OOXML (Excel) chart parts and their drawing anchors from a declarative specification."
exclude = ["/scripts", "/.github"]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/justinsimon182/ooxml-chart"
keywords = ["ooxml", "xlsx", "excel", "chart", "spreadsheet"]
categories = ["encoding"]
readme = "README.md"

[features]
# Derive `Serialize`/`Deserialize` for the spec types, so a chart can be
# declared in JSON, TOML or YAML rather than in code.
serde = ["dep:serde"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
